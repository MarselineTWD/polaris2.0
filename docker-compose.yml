services:
  polaris:
    build: .
    image: polaris:1.0.0
    container_name: polaris
    ports:
      # Локальный доступ без nginx; на внешнем интерфейсе сервера порт не публикуется.
      - "${POLARIS_BIND_ADDRESS:-127.0.0.1}:${POLARIS_PORT:-8000}:8000"
    environment:
      # Профиль для VPS с 4 CPU и 4 ГБ: одно ядро остаётся API и nginx.
      POLARIS_OPTIMIZER_WORKERS: "${POLARIS_OPTIMIZER_WORKERS:-3}"
      POLARIS_MAX_CONCURRENT_JOBS: "${POLARIS_MAX_CONCURRENT_JOBS:-1}"
      POLARIS_MAX_QUEUED_JOBS: "${POLARIS_MAX_QUEUED_JOBS:-3}"
    volumes:
      - polaris-state:/app/state
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - polaris
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  polaris-state:
